<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a5c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Цифровая биолаборатория</title>
<style>
:root {
  --bg: #f7f9f4;
  --surface: #ffffff;
  --primary: #1a5c2e;
  --primary-soft: #2d7a45;
  --accent: #4caf50;
  --accent-light: #e8f5e9;
  --text: #1c2b1c;
  --muted: #6b7c6b;
  --border: #dce8dc;
  --radius: 20px;
  --shadow: 0 8px 30px rgba(26, 92, 46, 0.08);
  --shadow-sm: 0 2px 12px rgba(26, 92, 46, 0.06);
  --safe: env(safe-area-inset-bottom, 20px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ===== HEADER ===== */
.header {
  background: var(--surface);
  padding: 18px 20px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.header-top {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.logo {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  object-fit: contain;
  background: #fff;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.brand h1 {
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.4px;
  line-height: 1.2;
}
.brand .slogan {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 500;
}
.search-box {
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 13px 16px 13px 46px;
  border: 1.5px solid var(--border);
  border-radius: 16px;
  font-size: 1rem;
  background: var(--bg);
  color: var(--text);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15);
  background: #fff;
}
.search-box input::placeholder { color: #9aab9a; }
.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.15rem;
  opacity: 0.6;
}

/* ===== NAV ===== */
.nav {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.nav.show { display: flex; }
.back-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 14px;
  background: var(--accent-light);
  color: var(--primary);
  font-size: 1.3rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .15s;
}
.back-btn:active { background: #c8e6c9; }
.crumbs {
  font-size: 0.88rem;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.crumbs span { color: var(--primary); font-weight: 600; }

/* ===== MAIN ===== */
.main {
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 20px calc(100px + var(--safe));
}

/* Home hero */
.hero {
  text-align: center;
  margin-bottom: 28px;
}
.hero-title {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
}
.hero-sub {
  font-size: 0.95rem;
  color: var(--muted);
}

/* Class buttons */
.class-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
.class-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  padding: 20px 8px;
  text-align: center;
  cursor: pointer;
  transition: all .18s;
  box-shadow: var(--shadow-sm);
}
.class-btn:active {
  transform: scale(0.96);
  border-color: var(--accent);
  background: var(--accent-light);
}
.class-btn .num {
  font-size: 1.9rem;
  font-weight: 800;
  color: var(--primary);
  line-height: 1;
}
.class-btn .lbl {
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 500;
}

/* Cards */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 12px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card:active {
  transform: scale(0.985);
  border-color: var(--accent);
  background: #fafffa;
}
.card h3 {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.card .arrow {
  color: var(--accent);
  font-size: 1.2rem;
  flex-shrink: 0;
  opacity: 0.7;
}

/* Section title */
.section-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 16px;
  letter-spacing: -0.3px;
}

/* Equipment chips */
.chips-wrap {
  margin-bottom: 24px;
}
.chips-label {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.chips-hint {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 14px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 20px;
}
.chip {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 0.9rem;
  cursor: pointer;
  user-select: none;
  transition: all .15s;
  font-weight: 500;
}
.chip.on {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(26, 92, 46, 0.25);
}
.chip.any {
  border-color: var(--accent);
  color: var(--primary-soft);
  font-weight: 600;
}
.chip.any.on {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* Primary button */
.btn {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 16px;
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, var(--primary), var(--primary-soft));
  color: #fff;
  box-shadow: 0 6px 20px rgba(26, 92, 46, 0.3);
  transition: opacity .15s, transform .12s;
}
.btn:active {
  opacity: 0.9;
  transform: scale(0.98);
}

/* Experiment card */
.exp-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all .15s;
  border-left: 5px solid var(--accent);
}
.exp-card:active {
  transform: scale(0.985);
  background: #fafffa;
}
.exp-card h3 {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}
.exp-card .meta {
  font-size: 0.82rem;
  color: var(--muted);
  margin-bottom: 10px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  background: var(--accent-light);
  color: var(--primary-soft);
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 500;
}

/* Detail */
.detail-head {
  margin-bottom: 24px;
}
.detail-head h2 {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.3;
  margin-bottom: 8px;
}
.detail-head .path {
  font-size: 0.88rem;
  color: var(--muted);
}
.block-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--primary);
  margin: 28px 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.block-title::before {
  content: "";
  width: 5px;
  height: 20px;
  background: var(--accent);
  border-radius: 3px;
}
.equip-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.equip-tag {
  background: var(--accent-light);
  color: var(--primary);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 500;
}
.step {
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.step-head {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.step-num {
  width: 30px;
  height: 30px;
  background: var(--primary);
  color: #fff;
  border-radius: 50%;
  font-size: 0.9rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-text {
  font-size: 0.98rem;
  flex: 1;
  padding-top: 3px;
}
.photo-place {
  background: linear-gradient(145deg, #eef7ee, #dcedc8);
  border: 2px dashed #81c784;
  border-radius: 14px;
  height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--primary-soft);
  font-size: 0.9rem;
  font-weight: 500;
}
.photo-place .ico {
  font-size: 1.8rem;
  margin-bottom: 6px;
  opacity: 0.8;
}
.result-box {
  background: #e8f5e9;
  border-radius: 14px;
  padding: 16px;
  margin-top: 20px;
  border-left: 5px solid var(--accent);
  font-size: 0.95rem;
}
.result-box strong { color: var(--primary); }
.note-box {
  background: #fff8e1;
  border-radius: 14px;
  padding: 16px;
  margin-top: 12px;
  border-left: 5px solid #ffb300;
  font-size: 0.93rem;
}

/* Reviews */
.reviews-head {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 18px;
}
.review-form {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
  margin-bottom: 24px;
}
.review-form input,
.review-form textarea {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  font-size: 0.98rem;
  margin-bottom: 12px;
  font-family: inherit;
  outline: none;
  background: var(--bg);
  transition: border-color .2s;
}
.review-form input:focus,
.review-form textarea:focus {
  border-color: var(--accent);
  background: #fff;
}
.review-form textarea { min-height: 100px; resize: vertical; }
.err-msg {
  color: #c62828;
  font-size: 0.88rem;
  margin-bottom: 10px;
  display: none;
  padding: 8px 12px;
  background: #ffebee;
  border-radius: 10px;
}
.success-msg {
  color: #2e7d32;
  font-size: 0.9rem;
  margin-bottom: 10px;
  display: none;
  padding: 8px 12px;
  background: #e8f5e9;
  border-radius: 10px;
}
.review-item {
  background: var(--surface);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.review-item .author {
  font-weight: 600;
  color: var(--primary);
  font-size: 0.95rem;
}
.review-item .date {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 2px;
}
.review-item .body {
  margin-top: 10px;
  font-size: 0.95rem;
  line-height: 1.5;
}

/* Footer */
.footer {
  text-align: center;
  padding: 28px 20px 40px;
  color: var(--muted);
  font-size: 0.86rem;
  border-top: 1px solid var(--border);
  margin-top: 12px;
}
.footer a {
  color: var(--primary-soft);
  text-decoration: none;
  font-weight: 500;
}
.footer .creator {
  margin: 8px 0 4px;
  font-weight: 600;
  color: var(--text);
}

/* Empty & utils */
.empty {
  text-align: center;
  padding: 50px 24px;
  color: var(--muted);
}
.empty .ico {
  font-size: 3rem;
  margin-bottom: 12px;
  opacity: 0.5;
}
.hidden { display: none !important; }
.count-badge {
  background: var(--accent-light);
  color: var(--primary);
  font-size: 0.8rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  margin-left: 8px;
}

/* Reviews entry on home */
.action-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px 20px;
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all .15s;
}
.action-card:active {
  transform: scale(0.985);
  border-color: var(--accent);
}
.action-card .ico {
  width: 48px;
  height: 48px;
  background: var(--accent-light);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.action-card .txt h3 {
  font-size: 1.02rem;
  font-weight: 600;
  color: var(--text);
}
.action-card .txt p {
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 2px;
}
</style>
</head>

{name:"Корень",subs:[{name:"Зоны корня",experiments:[{id:"6-2",name:"Строение корня, корневые волоски",equip:["проросток фасоли или пшеницы","микроскоп","лупа","предметное стекло","пипетка","вода"],steps:["Вырастить проросток во влажной салфетке за 5–7 дней.","Рассмотреть корень невооружённым глазом: найти кончик корня, зону растяжения, зону с волосками.","Положить корень на предметное стекло в каплю воды, рассмотреть под лупой или микроскопом (малое увеличение).","Найти тонкие выросты — корневые волоски.","Зарисовать корень с зонами."],result:"На участке корня чуть выше кончика — множество тонких волосковидных выростов."}]}]},
{name:"Побег",subs:[{name:"Почка: строение, виды",experiments:[{id:"6-3",name:"Строение почки",equip:["ветки тополя, сирени или берёзы","лупа","препаровальная игла","скальпель"],steps:["Рассмотреть почки на ветке: расположение (очередное, супротивное), размер, форму.","Отделить одну почку иглой.","Разрезать почку вдоль скальпелем.","Рассмотреть срез под лупой.","Найти почечные чешуи, зачаточные листья, конус нарастания (вегетативная почка) или зачатки цветков (генеративная).","Зарисовать продольный срез почки."],result:"Плотные наружные чешуи и внутри — маленькие зелёные зачаточные листья."}]},{name:"Стебель: строение, функции",experiments:[{id:"6-4",name:"Строение стебля (поперечный срез)",equip:["ветка липы, тополя или сирени","лупа","скальпель"],steps:["Сделать поперечный срез ветки скальпелем (тонкий, 1–2 мм).","Рассмотреть срез под лупой.","Найти: пробку (тёмный наружный слой), луб (светлый слой под пробкой), камбий (тонкий слой), древесину (основная масса), сердцевину (центр).","Зарисовать и подписать слои."],result:"Чёткие концентрические слои разного цвета."}]},{name:"Клеточное строение листа",experiments:[{id:"6-5",name:"Клеточное строение листа",equip:["микроскоп","предметное стекло","покровное стекло","лист традесканции или лука","скальпель","пипетка","вода"],steps:["Сделать тонкий срез мякоти листа (или снять кожицу с нижней стороны листа).","Поместить срез в каплю воды на предметное стекло, накрыть покровным.","Рассмотреть под микроскопом.","Найти клетки кожицы (прозрачные, плотно прилегающие) и клетки мякоти (с зелёными хлоропластами).","Зарисовать."],result:"Бесцветные клетки кожицы и зелёные клетки мякоти с хлоропластами."}]}]},
{name:"Жизнедеятельность растений",subs:[{name:"Фотосинтез",experiments:[{id:"6-6",name:"Фотосинтез: крахмал на свету",equip:["комнатное растение (герань, традесканция)","тёмная бумага или фольга","спирт","раствор йода","пробирка","водяная баня"],steps:["Закрыть часть листа с двух сторон фольгой (или тёмной бумагой).","Поставить растение на свет на 6–8 часов.","Срезать лист. Снять фольгу.","Обесцветить лист: опустить в кипящий спирт на водяной бане (осторожно, огнеопасно!) или обработать горячей водой.","Промыть лист водой, залить раствором йода.","Сравнить: часть, бывшая на свету, посинеет (крахмал); часть под фольгой останется светлой."],result:"Посинение только на освещённом участке листа.",note:"Упрощённый вариант (без спирта): йодную пробу можно сделать на срезе клубня картофеля, выращенного на свету и в темноте."}]},{name:"Дыхание растений",experiments:[{id:"6-7",name:"Дыхание растений",equip:["семена гороха","банка с крышкой","известковая вода","трубочка"],steps:["Замочить семена на сутки для набухания.","Поместить набухшие семена в банку, закрыть крышкой.","Оставить на 6–12 часов в тёплом месте.","Открыть банку, опустить в неё трубочку и продуть воздух из банки через трубочку в пробирку с известковой водой (или просто прилить известковую воду в банку и взболтать).","Наблюдать помутнение известковой воды."],result:"Помутнение известковой воды — признак углекислого газа, выделенного дышащими семенами."}]},{name:"Испарение воды (транспирация)",experiments:[{id:"6-8",name:"Испарение воды листьями",equip:["комнатное растение или ветка с листьями","прозрачный полиэтиленовый пакет","нитка"],steps:["Надеть пакет на ветку с листьями (или на часть растения).","Завязать пакет у основания, чтобы он был герметичен.","Поставить растение на свет (не под прямое солнце).","Через 2–4 часа проверить: на внутренней стороне пакета появятся капли воды."],result:"Капли конденсата на пакете — испарившаяся вода."}]}]},
{name:"Размножение растений",subs:[{name:"Вегетативное размножение",experiments:[{id:"6-9",name:"Вегетативное размножение (черенкование)",equip:["комнатное растение (традесканция, герань)","ножницы","стакан с водой"],steps:["Срезать побег с 3–4 листьями (черенок) под углом.","Удалить нижние листья.","Поставить черенок в стакан с водой.","Поставить в светлое место.","Через 1–2 недели наблюдать образование корней.","Когда корни достигнут 2–3 см, пересадить в почву."],result:"Образование белых корешков на нижней части черенка."}]}]},
{name:"Цветок и плод",subs:[{name:"Цветок: строение",experiments:[{id:"6-10",name:"Строение цветка",equip:["крупный цветок (вишня, яблоня, петуния, лилия)","лупа","препаровальная игла"],steps:["Рассмотреть цветок снаружи: найти цветоножку, цветоложе, чашелистики, лепестки.","Удалить чашелистики и лепестки иглой.","Найти тычинки (тычиночная нить + пыльник) и пестик (рыльце, столбик, завязь).","Разрезать завязь вдоль, найти семязачатки.","Зарисовать и подписать части."],result:"Все части цветка, особенно завязь с семязачатками внутри."}]},{name:"Плоды: виды, значение",experiments:[{id:"6-11",name:"Строение и классификация плодов",equip:["разные плоды: яблоко, помидор, огурец, орех, семечко подсолнечника, жёлудь","лупа"],steps:["Рассмотреть каждый плод: сочный или сухой, односемянный или многосемянный, раскрывающийся или нет.","Разрезать сочные плоды, найти семена.","Разломить орех, найти ядро (семя).","Распределить плоды по группам: сочные/сухие, односемянные/многосемянные.","Записать в таблицу."],result:"Различия в строении плодов и количестве семян."}]}]}
]},
"7":{title:"7 класс",topics:[
{name:"Водоросли",subs:[{name:"Зелёные водоросли",experiments:[{id:"7-1",name:"Одноклеточные водоросли",equip:["микроскоп","предметное стекло","покровное стекло","вода из пруда/аквариума","пипетка"],steps:["Взять воду из пруда или аквариума, где вода позеленела.","Пипеткой нанести каплю на предметное стекло, накрыть покровным.","Рассмотреть под микроскопом при большом увеличении.","Найти одноклеточные зелёные организмы (хламидомонада — овальная с двумя жгутиками, хлорелла — мелкая круглая)."],result:"Мелкие зелёные клетки, некоторые подвижные.",note:"Гарантировать наличие именно хламидомонады нельзя, но зелёные одноклеточные водоросли в «зацветшей» воде почти всегда есть."}]},{name:"Многоклеточные зелёные водоросли",experiments:[{id:"7-2",name:"Спирогира",equip:["микроскоп","предметное стекло","покровное стекло","тина из пруда","пипетка","вода"],steps:["Собрать тину в пруду/реке (ярко-зелёные скользкие нити).","Поместить небольшой пучок на предметное стекло в каплю воды, накрыть покровным.","Рассмотреть под малым, затем большим увеличением.","Найти длинные неветвящиеся нити из цилиндрических клеток. В клетках — спирально закрученные ленты хлоропластов."],result:"Нити из соединённых торцами клеток, внутри — спиральные зелёные структуры."}]}]},
{name:"Высшие споровые растения",subs:[{name:"Мхи",experiments:[{id:"7-3",name:"Строение мха (кукушкин лён)",equip:["микроскоп","лупа","живые растения кукушкина льна","предметное стекло","пипетка"],steps:["Рассмотреть растение: стебель, листья (мелкие, узкие), ризоиды (тонкие нити у основания).","Найти на верхушке стебля коробочку на ножке (если есть).","Поместить лист мха на предметное стекло в каплю воды, рассмотреть под микроскопом (или лупой).","Отметить: лист однослойный, без жилки (или с узкой жилкой), клетки мелкие."],result:"Простое строение листа, отсутствие сложных тканей."}]},{name:"Папоротники",experiments:[{id:"7-4",name:"Строение папоротника",equip:["живой или высушенный папоротник","лупа","препаровальная игла"],steps:["Рассмотреть растение: корневище (под землёй/у основания), листья (вайи), молодые завитые листья («улитки»).","Перевернуть зрелый лист, найти на нижней стороне мелкие коричневые бугорки — сорусы (скопления спорангиев).","Рассмотреть сорус под лупой.","Зарисовать."],result:"Сорусы на нижней стороне листа — признаки спорового размножения."}]}]},
{name:"Голосеменные",subs:[{name:"Хвойные: строение, размножение",experiments:[{id:"7-5",name:"Хвоя и шишки хвойных",equip:["ветки сосны, ели, лиственницы","шишки (сосны, ели)","лупа"],steps:["Сравнить хвою разных пород: у сосны — длинная, в пучках по 2; у ели — короткая, по одной; у лиственницы — мягкая, опадающая.","Рассмотреть шишку: у сосны — деревянистая, с чешуями; у ели — более тонкие чешуи.","Найти под чешуями семена (если шишка зрелая).","Зарисовать хвою и шишку."],result:"Различия в форме хвои и строении шишек."}]}]},
{name:"Грибы",subs:[{name:"Шляпочные грибы",experiments:[{id:"7-6",name:"Шляпочный гриб",equip:["свежий гриб (шампиньон или лесной)","лупа","препаровальная игла"],steps:["Рассмотреть плодовое тело: шляпка, ножка.","Перевернуть шляпку: найти пластинки (у шампиньона, сыроежки) или трубки (у белого гриба, подберёзовика).","Осторожно отделить часть пластинки/трубочки, рассмотреть под лупой.","Найти споры (тёмный порошок на пластинках).","Разрезать ножку вдоль, отметить плотность."],result:"Пластинчатый или трубчатый гименофор, споры."}]},{name:"Плесневые грибы и дрожжи",experiments:[{id:"7-7a",name:"Плесень мукора (повтор 5 класса)",equip:["микроскоп","предметное стекло","покровное стекло","кусок хлеба","контейнер с крышкой","препаровальная игла"],steps:["За 3–5 дней до урока поместить кусок хлеба во влажный закрытый контейнер и оставить в тёплом месте.","В день работы рассмотреть плесень невооружённым глазом: белый пушистый налёт.","Приготовить микропрепарат: на предметное стекло нанести каплю воды, препаровальной иглой перенести небольшой кусочек плесени, накрыть покровным стеклом.","Рассмотреть под микроскопом: видны нити мицелия (гифы) и округлые головки со спорами (спорангии).","Зарисовать увиденное."],result:"Ветвящиеся нити и шаровидные спорангии на концах гиф."},{id:"7-7b",name:"Дрожжи (повтор 5 класса)",equip:["микроскоп","предметное стекло","покровное стекло","сухие или прессованные дрожжи","сахар","тёплая вода","стакан","пипетка"],steps:["Развести щепотку дрожжей в тёплой воде с добавлением щепотки сахара.","Оставить на 15–20 минут в тёплом месте.","Пипеткой нанести каплю суспензии на предметное стекло, накрыть покровным стеклом.","Рассмотреть под микроскопом при большом увеличении.","Найти клетки овальной формы, некоторые — с маленькими «выростами» (почками)."],result:"Овальные клетки дрожжей, часть из них почкуется."}]}]},
{name:"Лишайники",subs:[{name:"Строение лишайников",experiments:[{id:"7-8",name:"Лишайники",equip:["лишайники с коры деревьев или камней","микроскоп","лупа","скальпель"],steps:["Собрать лишайники с коры/камней.","Рассмотреть внешний вид: накипные (корка), листоватые (пластинки), кустистые (веточки).","Сделать тонкий срез листоватого лишайника, рассмотреть под микроскопом.","Найти верхний коровый слой, зелёный слой (водоросли), сердцевину (грибные нити)."],result:"Слоистое строение — признак симбиоза гриба и водоросли."}]}]},
{name:"Бактерии",subs:[{name:"Роль бактерий в жизни человека",experiments:[{id:"7-9",name:"Молочнокислые бактерии",equip:["микроскоп","предметное стекло","покровное стекло","простокваша или кефир","пипетка","вода"],steps:["Нанести каплю простокваши на предметное стекло, разбавить каплей воды, накрыть покровным.","Рассмотреть под микроскопом при большом увеличении (можно с иммерсией, если есть).","Найти мелкие вытянутые палочки — молочнокислые бактерии."],result:"Мелкие палочковидные клетки (могут быть одиночные или цепочками).",note:"Без окраски видно плохо, но при большом увеличении и хорошем освещении палочки различимы."}]}]},
{name:"Покрытосеменные",subs:[{name:"Определение растений",experiments:[{id:"7-10",name:"Определение растений по ключу",equip:["живые растения с улицы","определитель","лупа"],steps:["Взять растение целиком (или ветку с листьями и цветками/плодами).","По ключу последовательно выбирать признаки: дерево/трава, листорасположение, форма листа, наличие цветков/плодов.","На каждом шаге ключа выбирать одну из двух альтернатив (теза/антитеза).","Дойти до названия семейства/рода/вида.","Записать результат."],result:"Работа с реальным растением, а не картинкой."}]}]}
]},
"8":{title:"8 класс",topics:[
{name:"Одноклеточные животные",subs:[{name:"Простейшие",experiments:[{id:"8-1",name:"Инфузория-туфелька",equip:["микроскоп","предметное стекло","покровное стекло","вода из пруда/аквариума","пипетка","вата"],steps:["Взять воду из пруда или приготовить культуру на банановой корке за 3–5 дней.","Нанести каплю на предметное стекло. Можно добавить маленький кусочек ваты, чтобы замедлить движение.","Накрыть покровным, рассмотреть под малым, затем большим увеличением.","Найти крупные клетки, похожие на туфельку, с ресничками по краю."],result:"Движение клетки, реснички, сократительные вакуоли."},{id:"8-2",name:"Амёба, эвглена",equip:["микроскоп","предметное стекло","покровное стекло","вода из пруда/аквариума","пипетка"],steps:["Взять воду из пруда/аквариума.","Рассмотреть каплю под микроскопом.","Найти амёбу: бесформенный комочек, медленно выпускающий ложноножки. Эвглена: овальная, зелёная, с жгутиком, быстро движется."],result:"Наличие амёбы и/или эвглены (гарантировать нельзя, но в «зацветшей» воде часто встречаются)."}]}]},
{name:"Кишечнополостные",subs:[{name:"Гидра: строение, жизнедеятельность",experiments:[{id:"8-3",name:"Гидра",equip:["микроскоп","лупа","вода из пруда/реки с растениями","предметное стекло","пипетка"],steps:["Собрать в пруду растения с прикреплёнными гидрами (летом).","Поместить гидру в каплю воды на предметное стекло (или в чашку Петри).","Рассмотреть под лупой или малым увеличением микроскопа: тело-стебелёк, щупальца, подошва.","Наблюдать реакцию на прикосновение иглой — сокращение."],result:"Щупальца, сокращение тела.",note:"Только тёплый сезон."}]}]},
{name:"Черви",subs:[{name:"Кольчатые черви",experiments:[{id:"8-4",name:"Дождевой червь",equip:["живой дождевой червь","лупа","влажная бумага","стеклянная банка"],steps:["Найти червя после дождя или выкопать в почве.","Поместить на влажную бумагу.","Рассмотреть: сегменты тела, поясок (утолщение), щетинки (под лупой).","Наблюдать движение: сокращение и вытягивание тела.","Проверить реакцию на прикосновение."],result:"Сегментированное тело, движение за счёт сокращений, щетинки."}]}]},

const BAD = ["хуй","хуя","хуе","хуи","бля","блять","блядь","ебать","ебан","ебал","ебло","пизд","пиздец","сука","суки","мудак","мудила","говно","дерьмо","гандон","залупа","fuck","shit","bitch","asshole","dick","cunt"];
function isBad(t){const s=(t||"").toLowerCase().replace(/[^\wа-яё]/gi," ");return BAD.some(w=>s.includes(w))}

const S = {view:"home", classId:null, topicIdx:null, subIdx:null, selected:new Set(), any:false, exp:null, stack:[]};
const app = document.getElementById("app");
const nav = document.getElementById("nav");
const crumbs = document.getElementById("crumbs");
const footer = document.getElementById("footer");

function allExps(){
  const list=[];
  for(const [cid,c] of Object.entries(DATA)){
    c.topics.forEach((t,ti)=>{
      t.subs.forEach((s,si)=>{
        s.experiments.forEach(e=>{
          list.push({...e, classId:cid, classTitle:c.title, topic:t.name, sub:s.name});
        });
      });
    });
  }
  return list;
}
function equipOf(cid,ti,si){
  const set=new Set();
  (DATA[cid].topics[ti].subs[si].experiments||[]).forEach(e=>e.equip.forEach(x=>set.add(x)));
  return [...set].sort((a,b)=>a.localeCompare(b,"ru"));
}
function match(exps,sel,any){
  if(any || sel.size===0) return exps;
  return exps.filter(e=>e.equip.some(x=>sel.has(x)));
}
function setCrumbs(parts){
  crumbs.innerHTML = parts.map((p,i)=> i===parts.length-1 ? `<span>${p}</span>` : p).join(" · ");
}
function showNav(v){
  nav.classList.toggle("show", v);
  footer.classList.toggle("hidden", v);
}

function topics(){
  S.view="topics"; S.topicIdx=null;
  showNav(true);
  setCrumbs([DATA[S.classId].title]);
  const list = DATA[S.classId].topics;
  app.innerHTML = `

  document.querySelectorAll(".card").forEach(el=>{
    el.onclick = ()=>{ S.topicIdx=+el.dataset.i; S.stack.push("topics"); subs(); };

function subs(){
  S.view="subs"; S.subIdx=null;
  showNav(true);
  const t = DATA[S.classId].topics[S.topicIdx];
  setCrumbs([DATA[S.classId].title, t.name]);
  app.innerHTML = `
    <div class="section-title">${t.name}</div>
    ${t.subs.map((s,i)=>`
      <div class="card" data-i="${i}">
        <h3>${s.name}</h3>
        <div class="arrow">›</div>
      </div>
    `).join("")}
  `;
  document.querySelectorAll(".card").forEach(el=>{
    el.onclick = ()=>{
      S.subIdx = +el.dataset.i;
      S.selected = new Set();
      S.any = false;
      S.stack.push("subs");
      filter();
    };
  });
}

  const t = DATA[S.classId].topics[S.topicIdx];
  const s = t.subs[S.subIdx];

      <div class="chips-hint">Можно выбрать несколько. Достаточно одного совпадения. «Любое» — все опыты этой подтемы.</div>
      <div class="chips">
        <div class="chip any ${S.any?"on":""}" data-any="1">✨ Любое</div>
        ${eq.map(e=>`<div class="chip ${S.selected.has(e)?"on":""}" data-e="${e}">${e}</div>`).join("")}
      </div>
      <button class="btn" id="goSearch">Показать опыты</button>
    </div>
  `;
  document.querySelectorAll(".chip").forEach(ch=>{
    ch.onclick = ()=>{
      if(ch.dataset.any){
        S.any = !S.any;
        if(S.any) S.selected.clear();
        document.querySelectorAll(".chip:not(.any)").forEach(c=>c.classList.remove("on"));
      } else {
        S.any = false;
        document.querySelector(".chip.any")?.classList.remove("on");
        const e = ch.dataset.e;
        if(S.selected.has(e)){ S.selected.delete(e); ch.classList.remove("on"); }
        else { S.selected.add(e); ch.classList.add("on"); }
      }
      ch.classList.toggle("on", ch.dataset.any ? S.any : S.selected.has(ch.dataset.e));
    };
  });
  document.getElementById("goSearch").onclick = ()=>{ S.stack.push("filter"); results(); };
}

function results(){
  S.view="results";
  showNav(true);
  const t = DATA[S.classId].topics[S.topicIdx];
  const s = t.subs[S.subIdx];
  setCrumbs([DATA[S.classId].title, t.name, s.name]);
  const list = match(s.experiments, S.selected, S.any);
  if(!list.length){
    app.innerHTML = `<div class="empty"><div class="ico">🔬</div><p>Нет подходящих опытов.<br>Попробуйте «Любое» или другие предметы.</p></div>`;
    return;
  }
  app.innerHTML = `
    <div class="section-title">Найдено: ${list.length}</div>
    ${list.map(e=>`
      <div class="exp-card" data-id="${e.id}">
        <h3>${e.name}</h3>
        <div class="tags">${e.equip.slice(0,5).map(x=>`<span class="tag">${x}</span>`).join("")}${e.equip.length>5?`<span class="tag">+${e.equip.length-5}</span>`:""}</div>
      </div>
    `).join("")}
  `;
  document.querySelectorAll(".exp-card").forEach(el=>{
    el.onclick = ()=>{
      const exp = list.find(x=>x.id===el.dataset.id);
      S.exp = {...exp, classTitle:DATA[S.classId].title, topic:t.name, sub:s.name};
      S.stack.push("results");
      detail();
    };
  });
}

function detail(){
  S.view="detail";
  showNav(true);
  const e = S.exp;
  setCrumbs([e.classTitle, "Опыт"]);
  app.innerHTML = `
    <div class="detail-head">
      <h2>${e.name}</h2>
      <div class="path">${e.classTitle} · ${e.topic} · ${e.sub}</div>
    </div>
    <div class="block-title">Оборудование</div>
    <div class="equip-tags">${e.equip.map(x=>`<span class="equip-tag">${x}</span>`).join("")}</div>
    <div class="block-title">Ход работы</div>
    ${e.steps.map((st,i)=>`
      <div class="step">
        <div class="step-head">
          <span class="step-num">${i+1}</span>
          <div class="step-text">${st}</div>
        </div>
        <div class="photo-place"><div class="ico">📷</div>Место для фото этапа ${i+1}</div>
      </div>
    `).join("")}
    ${e.result?`<div class="result-box"><strong>Что должно быть видно:</strong><br>${e.result}</div>`:""}
    ${e.note?`<div class="note-box"><strong>Дополнительно:</strong><br>${e.note}</div>`:""}
  `;
}

function doSearch(q){
  S.view="search";
  showNav(true);
  setCrumbs(["Поиск"]);
  const qq = q.toLowerCase().trim();
  if(!qq){ home(); return; }
  const found = allExps().filter(e=>{
    const str = (e.name+" "+e.topic+" "+e.sub+" "+e.equip.join(" ")).toLowerCase();
    return str.includes(qq);
  });
  if(!found.length){
    app.innerHTML = `<div class="empty"><div class="ico">🔍</div><p>По запросу «${q}» ничего не найдено</p></div>`;
    return;
  }
  app.innerHTML = `
    <div class="section-title">Найдено: ${found.length}</div>
    ${found.map(e=>`
      <div class="exp-card" data-id="${e.id}">
        <h3>${e.name}</h3>
        <div class="meta">${e.classTitle} · ${e.topic}</div>
        <div class="tags">${e.equip.slice(0,4).map(x=>`<span class="tag">${x}</span>`).join("")}</div>
      </div>
    `).join("")}
  `;
  document.querySelectorAll(".exp-card").forEach(el=>{
    el.onclick = ()=>{
      const exp = found.find(x=>x.id===el.dataset.id);
      S.exp = exp;
      S.stack.push("search");
      detail();
    };
  });
}

const BIN_ID = "6ae8daf6ffd5d16053a04661";
const MASTER_KEY = "$2a$10$Jh0JGbbexLu1mmbW6.I5xOXL9FoOIEaI.EUwo0yXdBALggbK0hZm.";

async function loadReviews() {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { "X-Master-Key": MASTER_KEY }
    });
    if (!res.ok) throw new Error("Ошибка загрузки");
    const data = await res.json();
    return Array.isArray(data.record) ? data.record : [];
  } catch (e) {
    console.error(e);
    return [];
  }
}

async function saveReviews(list) {
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": MASTER_KEY
      },
      body: JSON.stringify(list)
    });
    return res.ok;
  } catch (e) {
    console.error(e);
    return false;
  }
}

async function reviews() {
  S.view = "reviews";
  showNav(true);
  setCrumbs(["Отзывы"]);

  app.innerHTML = `
    <div class="reviews-head">Отзывы</div>
    <div class="review-form">
      <div class="err-msg" id="err"></div>
      <div class="success-msg" id="ok"></div>
      <input type="text" id="nick" placeholder="Ваш ник (например: Ученик5А)" maxlength="30">
      <textarea id="txt" placeholder="Напишите отзыв о приложении..." maxlength="500"></textarea>
      <button class="btn" id="send">Отправить отзыв</button>
    </div>
    <div id="list">
      <div class="empty"><div class="ico">⏳</div><p>Загрузка отзывов...</p></div>
    </div>
  `;

  const list = await loadReviews();
  const listEl = document.getElementById("list");

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty"><div class="ico">💬</div><p>Пока нет отзывов.<br>Будьте первым!</p></div>`;
  } else {
    listEl.innerHTML = list.slice().reverse().map(r => `
      <div class="review-item">
        <div class="author">${esc(r.nick || "")}</div>
        <div class="date">${r.date || ""}</div>
        <div class="body">${esc(r.text || "")}</div>
      </div>
    `).join("");
  }

  document.getElementById("send").onclick = async () => {
    const nick = document.getElementById("nick").value.trim();
    const text = document.getElementById("txt").value.trim();
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    err.style.display = "none";
    ok.style.display = "none";

    if (!nick || !text) {
      err.textContent = "Заполните ник и текст отзыва.";
      err.style.display = "block";
      return;
    }
    if (isBad(nick) || isBad(text)) {
      err.textContent = "Нельзя отправлять сообщения с нецензурной лексикой.";
      err.style.display = "block";
      return;
    }

    const newReview = {
      nick,
      text,
      date: new Date().toLocaleString("ru-RU", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      })
    };

    const currentList = await loadReviews();
    currentList.push(newReview);

    const success = await saveReviews(currentList);
    if (success) {
      ok.textContent = "Отзыв успешно добавлен!";
      ok.style.display = "block";
      document.getElementById("nick").value = "";
      document.getElementById("txt").value = "";
      setTimeout(() => reviews(), 900);
    } else {
      err.textContent = "Не удалось сохранить. Попробуйте ещё раз.";
      err.style.display = "block";
    }
  };
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

document.getElementById("back").onclick = ()=>{
  if(!S.stack.length){ home(); return; }
  const prev = S.stack.pop();
  if(prev==="home") home();
  else if(prev==="topics") topics();
  else if(prev==="subs") subs();
  else if(prev==="filter") filter();
  else if(prev==="results") results();
  else if(prev==="search"){
    const q = searchEl.value;
    if(q.trim()) doSearch(q); else home();
  } else home();
};

let tmr;
searchEl.addEventListener("input", e=>{
  clearTimeout(tmr);
  tmr = setTimeout(()=>{
    const q = e.target.value;
    if(q.trim().length >= 2){
      S.stack = ["home"];
      doSearch(q);
    } else if(!q.trim() && S.view==="search") home();
  }, 280);
});

home();
</script>
